  extr_grad: true
  intr_grad: false
  intr_model: !!python/object/apply:refiner.camera.backends.MODEL
  - 2
  ndc_ranges: !!python/tuple
  - -1
  - 1
  - 1
  - -1
  - 0
  - 1
  viewport: !!python/tuple
  - 0
  - -1
  - -1
  - 0
  - 0
  - 1
data:
  absolute_normals: true
  cam_precomp: false
  equalize_intensity: false
  img_center_crop: !!python/tuple
  - 0
  - 0
  img_channels:
  - g
  img_min_size: -1
  path: /home/ugoinsalaco/Documents/Datasets/Common
  pc_channels:
  - x
  - y
  - g
  - z
  pc_dynamic_scale: true
  pc_lod_filter: -1.0
